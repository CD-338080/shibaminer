# 24/7 payouts with the PC off — GitHub runner talks to Telegram directly.
name: payout-channel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: .data
          key: payout-sent-v1
          restore-keys: |
            payout-sent-
      - name: Post live SHIB payouts to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PAYOUT_CHANNEL_ID: ${{ secrets.PAYOUT_CHANNEL_ID }}
          NEXT_PUBLIC_BOT_USERNAME: Shiba_Inu_Pro_Miner_Bot
          SEND_COUNT: '3'
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$PAYOUT_CHANNEL_ID" ]; then
            echo "Add GitHub secrets BOT_TOKEN and PAYOUT_CHANNEL_ID"
            exit 1
          fi
          mkdir -p .data
          node scripts/tick-payouts.js
